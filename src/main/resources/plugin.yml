name: onigokkopuraguinn
version: '${version}'

main: com.brico.onigokkopuraguinn.Onigokkopuraguinn
api-version: '26.2'
load: POSTWORLD

commands:
  gamestart:
    description: ブレイズロッドで選択中のチェストを自動登録し、アイテムを配置してゲームを開始します
    usage: /gamestart
    permission: onigokkopuraguinn.gamestart
  gamereset:
    description: 登録済みチェストの中身だけ空にします（登録は残ります）
    usage: /gamereset
    permission: onigokkopuraguinn.gamereset
  gameclear:
    description: ゲームをクリアし、プレイヤーをリスポーン地点へ戻します
    usage: /gameclear
    permission: onigokkopuraguinn.gameclear

permissions:
  onigokkopuraguinn.gamestart:
    description: /gamestart を実行できます（コマンドブロック可）
    default: true
  onigokkopuraguinn.gamereset:
    description: /gamereset を実行できます（コマンドブロック可）
    default: true
  onigokkopuraguinn.gameclear:
    description: /gameclear を実行できます（コマンドブロック可）
    default: true
